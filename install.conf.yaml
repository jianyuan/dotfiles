- defaults:
    link:
      create: true
      relink: true

- link:
    ~/.gitconfig:
    ~/.gitignore_global:
    ~/.config/direnv: direnv
    ~/.config/ghostty: ghostty
    ~/.config/mise: mise

- clean: ["~"]

- create:
    - ~/code

- shell:
    - command: brew bundle install
      stdout: true
